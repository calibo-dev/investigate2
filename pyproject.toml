[project]
name = "latest-ai-development"
version = "0.1.0"
description = "Configuration-driven LangGraph workflow template"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
  "azure-identity>=1.25.1",
  "azure-keyvault-secrets>=4.10.0",
  "langgraph>=0.4.8",
  "langchain>=0.3.20",
  "langchain-anthropic>=0.3.0",
  "langchain-aws>=1.0.0",
  "langchain-core>=0.3.40",
  "langchain-google-genai>=2.0.0",
  "langchain-openai>=0.3.8",
  "langchain-community>=0.3.19",
  "langchain-ollama>=0.2.3",
  "langsmith>=0.8.5",

  "fastapi>=0.115.8",
  "uvicorn>=0.34.0",

  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",

  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",

  "boto3>=1.37.0",

  # Useful for API tools / external integrations
  "httpx>=0.27.0",

  # Compatibility utilities
  "typing-extensions>=4.12.0"
]

[project.optional-dependencies]

dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.7",
  "mypy>=1.15.0",
  "types-PyYAML>=6.0.12"
]

[project.scripts]
latest_ai_development = "latest_ai_development.main:run"
test = "latest_ai_development.main:test"
run_with_trigger = "latest_ai_development.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latest_ai_development"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
